<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .table-new {
            height: 300px;
            width: 300px;
            margin: 50px;
            background-color: bisque;
            background-size: cover;
            border: 2px solid red;
            padding: 20px;
            text-align: center;
            margin-top: 100px;
            margin-left: 500px;
            box-shadow: 1px 5px 15px 20px red;
        }

        .avatar {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            color: thistle;
            border-radius: 50%;
            align-items: center;
            display: flex;
            justify-content: center;
            font-size: 36px;
            margin: auto;
        }

        .name {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 20px;
        }

        .about {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: slategrey;
            font-size: 12px;
        }

        .intro {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 18px;
        }

        .view-button {
            background-color: crimson;
            padding: 15px;
            text-decoration: none;
            color: aliceblue;
            border-radius: 28px;
            margin-top: 10px;
            padding: 10px 20px;
        }

        .view-button:hover {
            color: chocolate;
        }
    </style>
</head>

<body>
    <div class="table-new">
        <p class="avatar">LKK</p>
        <p class="name">Karthi</p>
        <p class="about">Senior Software Developer</p>
        <p class="intro">Learning Full Stack Development</p>
        <a href="#" class="view-button">View Profile</a>
    </div>
</body>

</html>
