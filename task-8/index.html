<!DOCTYPE html>
<html>

<head>
    <style>
        .features-wrapper {
            width: 100%;
            margin: 0rem 2rem;
            box-sizing: border-box;
        }

        .feature-card {
            border-left-width: 48%;
            margin-right: 4%;
            padding: 1.5rem;
            background-color: #f8fafc;
            border: 1px #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .feature-card:last-child {
            margin-right: 0;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }

        .feature-icon .feature-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .feature-icon .feature-desc {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.4rem;
            margin-bottom: 0;
        }

        .features-wrapper.clear-fix {
            clear: both
        }
    </style>
</head>

<body>
    <div class="features-wrapper">
        <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <h3 class="feature-title">Lightning Fast</h3>
            <p class="feature-desc">Optimized for minimal load times and maximum efficiency across devices.</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">🔒</div>
            <h3 class="feature-title">Secure by Default</h3>
            <p class="feature-desc">Built with privacy and security principles integrated right from the ground up.</p>
        </div>
        <div class="clearfix"></div>
    </div>
</body>

</html>
