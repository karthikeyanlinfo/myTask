<!DOCTYPE html>
<html>

<head>
    <style>
        .alert-box {
            width: 500px;
            margin: 0rem 1.5rem;
            background-color: #fefce8;
            border: #fef08a;
            padding: 1.25rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .alert-icon {
            height: 32px;
            width: 32px;
            line-height: 32px;
            text-align: center;
            background-color: #eab308;
            color: #ffffff;
            font-family: 800;
            border-radius: 50%;
            margin-right: 1rem;
        }

        .alert-content .alert-title {
            width: 420px;
            font-size: 1rem;
            font-weight: 700;
            color: #854d0e;
            margin-bottom: 0.25rem;

        }

        .alert-content .alert-message {
            font-size: 0.875rem;
            color: #a16207;
            line-height: 1.35rem;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="alert-box">
        <span class="alert-icon">!</span>
        <div class="alert-content">
            <h4 class="alert-title">Account Verification Required</h4>
            <p class="alert-message">
                Please check your email inbox to verify your account before accessing all features.
            </p>
        </div>
        <div class="clearfix"></div>
    </div>
</body>

</html>
