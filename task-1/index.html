<!DOCTYPE html>
<html>

<head>
    <title>Profile Card</title>
    <style>
        .profile-card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
            margin: auto;
            margin-top: 150px;
            /* float: left; */

        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #7b1313;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 20px auto;
        }

        .name {
            font-size: 24px;
            margin: 10px 0;
        }

        .role {
            font-size: 18px;
            color: #666;
            margin: 5px 0;
        }

        .bio {
            font-size: 14px;
            color: #333;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #7b1313;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #5a0f0f;
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <div class="avatar">JD</div>
        <h2 class="name">Jane Doe</h2>
        <p class="role">Software Engineer</p>
        <p class="bio">Passionate developer building clean web applications with HTML and pure CSS.</p>
        <a href="." class="btn">View Profile</a>
    </div>
</body>

</html>
