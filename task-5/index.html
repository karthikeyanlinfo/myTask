<!DOCTYPE html>
<html>

<head>
    <style>
        .cta-banner {
            width: 80%;
            margin: 0rem 3rem;
            background-color: #312e81;
            padding: 2rem 3.5rem;
            justify-content: center;
            border-radius: 16px;
            box-shadow: (0 20px 25px rgba(0, 0, 0, 0.15));
        }

        .cta-title {
            font-weight: 800;
            font-size: 2.25rem;
            color: #ffffff;
            line-height: 1.2rem;
            margin-bottom: 1rem;
        }

        .cta-subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: #c7d2fe;
            line-height: 1.6rem;
            margin-bottom: 2rem;
            margin: auto;
            margin-bottom: 2rem;
        }

        .button-group .btn-primary {
            display: inline-block;
            background-color: #818cf8;
            color: #ffffff;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            margin-right: 0.75rem;
        }

        .button-group .btn-secondary {
            display: inline-block;
            background-color: #ffffff;
            color: 2px #818cf8;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-primary:hover {
            color: #ff0000;
        }

        .btn-secondary:hover {
            color: #ff0000;
        }
    </style>
</head>

<body>
    <div class="cta-banner">
        <h1 class="cta-title">Build Stunning Interfaces Today</h1>
        <p class="cta-subtitle">
            Master the foundations of web design with standard HTML elements and pure CSS styling techniques.
        </p>
        <div class="button-group">
            <a href="#" class="btn-primary">Get Started Now</a>
            <a href="#" class="btn-secondary">Learn More</a>
        </div>
    </div>
</body>

</html>
