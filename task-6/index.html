<!DOCTYPE html>
<html>

<head>
    <style>
        .testimonial-box {
            width: 450px;
            margin: 0rem 2rem;
            background-color: #fffbe6;
            padding: 2rem 1.5rem;
            border: 16px #d97706;
            border-bottom-right-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        }

        .quote-text {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6rem;
            color: #78350f;
            margin-bottom: 1.25rem;
        }

        .author-info {
            border-top: 1px #fcd34d;
            padding-top: 0.75rem;
        }

        .author-info .author-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #451a03;
        }

        .author-info .author-title {
            font-size: 0.8rem;
            color: #92400e;
            margin-top: 0.15rem;
        }
    </style>
</head>

<body>
    <div class="testimonial-box">
        <p class="quote-text">
            "Understanding CSS fundamentals gave me total control over my visual designs without relying on heavy
            external dependencies."
        </p>
        <div class="author-info">
            <div class="author-name">Alex Rivera</div>
            <div class="author-title">Senior Frontend Developer</div>
        </div>
    </div>
</body>

</html>
