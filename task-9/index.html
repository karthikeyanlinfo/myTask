<!DOCTYPE html>
<html>

<head>
    <style>
        .stats-container {
            width: 95.5%;
            text-align: center;
            background-color: #0f172a;
            padding: 1rem 2rem;
            border-radius: 12px;
        }

        .stat-number {
            display: inline-block;
            width: 28%;
            margin: 0% 1.5%;
            padding: 1rem 1.25rem;
            background-color: #1e293b;
            border-radius: 8px;
            box-sizing: border-box;
            border-top: 3px #0ea5e9;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-number">99.9%</div>
            <div class="stat-label">Uptime Guaranteed</div>
        </div>
        <div class="stat-item">
            <div class="stat-number">10M+</div>
            <div class="stat-label">Active Users</div>
        </div>
        <div class="stat-item">
            <div class="stat-number">24/7</div>
            <div class="stat-label">Global Support</div>
        </div>
    </div>
</body>

</html>
